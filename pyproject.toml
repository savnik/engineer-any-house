# Udviklingsmiljø for repoets egne værktøjer (scripts/, tests/) – ikke en pakke og ikke en del af plugins.
# scripts/ og tests/ bruger kun standardbiblioteket; den eneste udviklingsafhængighed er uv til at låse
# plugin-værktøjernes miljøer (scripts/lock_environment.py). Med uv:  uv sync && uv run scripts/validate.py
# Plugin-værktøjerne har hver deres låste miljø: bim.py/fem.py setup (se ARKITEKTUR.md, "Python-miljøer").
[project]
name = "engineer-any-house-dev"
version = "0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["uv==0.13.6"]

[tool.uv]
package = false
