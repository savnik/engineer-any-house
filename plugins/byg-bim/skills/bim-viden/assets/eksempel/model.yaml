  - {id: K.02, etage: K, navn: Grovkøkken, punkt: [7500, 2000]}
  - {id: S.01, etage: S, navn: Stue, punkt: [2500, 2000]}
  - {id: S.02, etage: S, navn: Køkken, punkt: [2500, 6000]}
  - {id: S.03, etage: S, navn: Spisestue, punkt: [7500, 4000]}
  - {id: T.01, etage: "1", navn: Værelse, punkt: [5000, 4250], til_tag: TAG1}

