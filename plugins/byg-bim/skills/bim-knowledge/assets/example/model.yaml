# VVS: pillefyr med 2-strenget centralvarme (ring langs kælderens ydervægge, stigstrenge op til radiatorerne under
# vinduerne), indirekte opvarmet varmtvandsbeholder, koldt og varmt brugsvand til køkken og grovkøkken samt
# spildevand under kældergulvet med fald mod brønd foran huset. Rør er etage K; z er målt fra kældergulvet
# (stueetagens gulv = 2400, tagetagens = 5300). Fremløb ligger i z 1850, retur i 1700, koldt vand 1450, varmt 1300.
# El: TT-system med stikledning NOIKLX 4G16 fra kabelskabet ved vejskel til hovedtavlen på grovkøkkenets østvæg
# (stikledningssikring 35 A, måler, hovedafbryder, SPD type 2, tre RCD'er og ti grupper). Grupperne er kredse
# (IfcDistributionCircuit) under EL med gruppedata i el.py's tavleformat; kablerne er IfcCableSegment, så deres
# længde kan aflæses. Tavlediagrammet tegnes med `bim.py panel` og electrical-knowledge/scripts/diagram.py.
systemer:
  - {id: CV-F, navn: Centralvarme fremløb, art: varme}
  - {id: CV-R, navn: Centralvarme retur, art: varme, farve: [130, 40, 160]}
  - {id: BV-K, navn: Brugsvand koldt, art: brugsvand_koldt}
  - {id: BV-V, navn: Brugsvand varmt, art: brugsvand_varmt}
  - {id: AF, navn: Spildevand, art: afloeb}
  # el: forsyningen (TT) og grupperne som kredse under den; el = gruppedata i el.py's tavleformat
  - {id: EL, navn: El-forsyning, art: el}
  - {id: GR1, navn: Lys kælder og stueetage, art: belysning, under: EL,
     el: {nr: 1, sikring: 13, kurve: B, icn: 10000, fase: L1, kabel: NOIKLX, ledere: 3, tvaersnit: 1.5, isolering: xlpe,
          metode: [C], last: 2, rcd: RCD1, anvendelse: lys}}
  - {id: GR2, navn: Stik stue og spisestue, art: el, under: EL,
     el: {nr: 2, sikring: 13, kurve: B, icn: 10000, fase: L2, kabel: NOIKLX, ledere: 3, tvaersnit: 2.5, isolering: xlpe,
          metode: [C], last: 4, rcd: RCD2, anvendelse: stik}}
  - {id: GR3, navn: Stik køkken og køleskab, art: el, under: EL,
     el: {nr: 3, sikring: 13, kurve: B, icn: 10000, fase: L3, kabel: NOIKLX, ledere: 3, tvaersnit: 2.5, isolering: xlpe,
          metode: [C], last: 6, rcd: RCD1, anvendelse: stik}}
  - {id: GR4, navn: Komfur, art: el, under: EL,
     el: {nr: 4, sikring: 16, kurve: B, icn: 10000, fase: L1L2L3, kabel: NOIKLX, ledere: 5, tvaersnit: 2.5, isolering: xlpe,
          metode: [C], last: 10, rcd: RCD2, anvendelse: komfur}}
  - {id: GR5, navn: Opvaskemaskine, art: el, under: EL,
     el: {nr: 5, sikring: 13, kurve: B, icn: 10000, fase: L1, kabel: NOIKLX, ledere: 3, tvaersnit: 2.5, isolering: xlpe,
          metode: [C], last: 9, rcd: RCD2, anvendelse: maskine}}
  - {id: GR6, navn: Lys og stik tagetage, art: el, under: EL,
     el: {nr: 6, sikring: 13, kurve: B, icn: 10000, fase: L3, kabel: NOIKLX, ledere: 3, tvaersnit: 1.5, isolering: xlpe,
          metode: [C], last: 3, rcd: RCD2, anvendelse: blandet}}
  - {id: GR7, navn: Stik kælder (IP44 i grovkøkken), art: el, under: EL,
     el: {nr: 7, sikring: 13, kurve: B, icn: 10000, fase: L3, kabel: NOIKLX, ledere: 3, tvaersnit: 2.5, isolering: xlpe,
          metode: [C], last: 3, rcd: RCD2, anvendelse: stik}}
  - {id: GR8, navn: Vaskemaskine, art: el, under: EL,
     el: {nr: 8, sikring: 13, kurve: B, icn: 10000, fase: L2, kabel: NOIKLX, ledere: 3, tvaersnit: 2.5, isolering: xlpe,
          metode: [C], last: 9, rcd: RCD1, anvendelse: maskine}}
  - {id: GR9, navn: Pillefyr, art: el, under: EL,
     el: {nr: 9, sikring: 10, kurve: B, icn: 10000, fase: L3, kabel: NOIKLX, ledere: 3, tvaersnit: 1.5, isolering: xlpe,
          metode: [C], last: 2, rcd: RCD1, anvendelse: maskine}}
  - {id: GR10, navn: Elbillader, art: el, under: EL,
     el: {nr: 10, sikring: 16, kurve: B, icn: 10000, fase: L1L2L3, kabel: NOIKLX, ledere: 5, tvaersnit: 6, isolering: xlpe,
          metode: [C], last: 10, rcd: RCD3, anvendelse: elbil}}

