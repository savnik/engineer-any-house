  - {id: R-RAD2-F, etage: K, system: CV-F, diameter: 15, materiale: kobber, punkter: [[7140, 380, 1850], [7140, 380, 2550]]}
  - {id: R-RAD2-R, etage: K, system: CV-R, diameter: 15, materiale: kobber,
