  - {id: R-RAD3-F, etage: K, system: CV-F, diameter: 15, materiale: kobber, punkter: [[7060, 8120, 1850], [7060, 8120, 2550]]}
  - {id: R-RAD3-R, etage: K, system: CV-R, diameter: 15, materiale: kobber,
     punkter: [[7760, 7980, 1700], [7760, 7980, 2300], [7760, 8120, 2300], [7760, 8120, 2550]]}
  - {id: R-RAD4-F, etage: K, system: CV-F, diameter: 15, materiale: kobber, punkter: [[2560, 8120, 1850], [2560, 8120, 2550]]}
  - {id: R-RAD4-R, etage: K, system: CV-R, diameter: 15, materiale: kobber,
     punkter: [[3260, 7980, 1700], [3260, 7980, 2300], [3260, 8120, 2300], [3260, 8120, 2550]]}
  - {id: R-RAD5-F, etage: K, system: CV-F, diameter: 15, materiale: kobber, punkter: [[380, 3900, 1850], [380, 3900, 5450]]}
  - {id: R-RAD5-R, etage: K, system: CV-R, diameter: 15, materiale: kobber,
     punkter: [[520, 4600, 1700], [520, 4600, 2300], [380, 4600, 2300], [380, 4600, 5450]]}
  # varmtvandsbeholderens varmespiral
  - {id: R-VVB-F, etage: K, system: CV-F, diameter: 22, materiale: kobber, punkter: [[8400, 380, 1850], [8400, 1000, 1850], [8400, 1000, 900]]}
  - {id: R-VVB-R, etage: K, system: CV-R, diameter: 22, materiale: kobber, punkter: [[8600, 1000, 900], [8600, 1000, 1700], [8600, 520, 1700]]}
  # koldt vand: stikledning gennem østvæggen, hovedhane og måler, videre til beholder, grovkøkken og køkken
  - {id: R-BV-K, etage: K, system: BV-K, diameter: 22, materiale: pex,
     punkter: [[11000, 3000, 1450], [9620, 3000, 1450], [9620, 1500, 1450], [4150, 1500, 1450], [4150, 6500, 1450],
               [4850, 6500, 1450], [4850, 6500, 2900]]}
  - {id: R-BV-K-VVB, etage: K, system: BV-K, diameter: 18, materiale: pex,
     punkter: [[8850, 1500, 1450], [8850, 1000, 1450], [8850, 1000, 200], [8760, 1000, 200]]}
  - {id: R-BV-K-WC, etage: K, system: BV-K, diameter: 15, materiale: pex, punkter: [[5150, 1500, 1450], [5150, 2400, 1450], [5150, 2400, 500]]}
