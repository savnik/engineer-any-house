# Eksempelmodel (fiktiv): murermesterhus 1930'erne, kælder + stue + udnyttet tagetage under sadeltag.
# Bruges som skabelon og som test af værktøjet. Alle længder i mm. Lokale akser: x langs facaden mod vej.
model:
  navn: Eksempelhus
  schema: IFC4
  adresse: {vej: Eksempelvej 1, postnr: "9999", by: Eksempelby}
  bygning: {navn: Hus, opfoerelsesaar: 1937, anvendelse: Fritliggende enfamiliehus}
  geo: {oest: 720000.0, nord: 6180000.0, kote: 35.80, x_retning: 100}   # x peger mod ØSØ
  kontrol:
    areal: {K: 85.0, S: 85.0}        # BBR-arealer (brutto, m²) til sammenligning
    tolerance: 0.06

standard: {kilde: A, status: eksisterende}

typer:
  YV-beton:   {klasse: vaeg, navn: Kælderydervæg beton 300, lag: [[beton, 300]], ude: true, baerende: true}
  YV-hulmur:  {klasse: vaeg, navn: Ydervæg hulmur 300, lag: [[tegl, 108], [mineraluld, 84], [tegl, 108]],
               ude: true, baerende: true, u: 0.55}
  IV-mur:     {klasse: vaeg, navn: Indervæg ½-sten pudset, lag: [[puds, 10], [tegl, 108], [puds, 10]], baerende: true}
  IV-let:     {klasse: vaeg, navn: Let skillevæg, lag: [[gips, 13], [træ, 70], [gips, 13]]}
  GAVL:       {klasse: vaeg, navn: Gavl hulmur 300, lag: [[tegl, 108], [mineraluld, 84], [tegl, 108]], ude: true, baerende: true}
  KG:         {klasse: daek, navn: Kældergulv beton, lag: [[beton, 100], [grus, 150]]}
  BJL:        {klasse: daek, navn: Træbjælkelag, lag: [[træ gulv, 25], [træbjælker, 200], [puds på rør, 25]], baerende: true}
  TAG:        {klasse: tag, navn: Tegltag på lægter, lag: [[tagsten, 50], [lægter, 50], [spær, 150]]}
  V1:         {klasse: vindue, navn: Vindue 2-fag, bredde: 1180, hoejde: 1300, felter: 2}
  V2:         {klasse: vindue, navn: Kældervindue, bredde: 800, hoejde: 500}
  OV1:        {klasse: vindue, navn: Ovenlysvindue, bredde: 780, hoejde: 1180, ramme: 90}
  D1:         {klasse: doer, navn: Indvendig dør, bredde: 825, hoejde: 2040}
  D2:         {klasse: doer, navn: Hoveddør, bredde: 925, hoejde: 2100}

etager:
  - {id: K, navn: Kælder, kote: -2400, fri_hoejde: 2100}
  - {id: S, navn: Stueetage, kote: 0, fri_hoejde: 2600}
  - {id: "1", navn: Tagetage, kote: 2900}

vaegge:
  - {id: K-YV, etage: K, type: YV-beton, punkter: [[0, 0], [10000, 0], [10000, 8500], [0, 8500]], lukket: true,
     justering: yderside, kilde: D, ref: "Kældertegning 1937, mål 10,00 × 8,50"}
  - {id: K-IV1, etage: K, type: IV-mur, punkter: [[5000, 300], [5000, 8200]], kilde: D}
  - {id: S-YV, etage: S, type: YV-hulmur, punkter: [[0, 0], [10000, 0], [10000, 8500], [0, 8500]], lukket: true,
     justering: yderside, kilde: D, ref: "Stueplan 1937"}
  - {id: S-IV1, etage: S, type: IV-mur, punkter: [[5000, 300], [5000, 8200]], kilde: D}
  - {id: S-IV2, etage: S, type: IV-let, punkter: [[300, 4200], [5000, 4200]], kilde: M, usikkerhed: 20}
  # tagetage: murkrone og gavle i én løkke, klippet af tagets underside; skunkvægge 1,3 m
  - {id: T-YV, etage: "1", type: GAVL, punkter: [[0, 0], [10000, 0], [10000, 8500], [0, 8500]], lukket: true,
     justering: yderside, hoejde: 6000, til_tag: TAG1}
  - {id: T-SKUNK-S, etage: "1", type: IV-let, punkter: [[300, 1500], [9700, 1500]], hoejde: 1300, justering: hoejre}
  - {id: T-SKUNK-N, etage: "1", type: IV-let, punkter: [[300, 7000], [9700, 7000]], hoejde: 1300, justering: venstre}

aabninger:
  - {id: K-V1, vaeg: K-YV.1, type: V2, afstand: 1500, brystning: 1500}
  - {id: K-V2, vaeg: K-YV.1, type: V2, afstand: 7000, brystning: 1500}
  - {id: K-D1, vaeg: K-IV1, type: D1, afstand: 3000, slaar_mod: hoejre}
  - {id: S-D0, vaeg: S-YV.1, type: D2, afstand: 4000, slaar_mod: inde, haengsel: slut, kilde: F, ref: "foto facade"}
  - {id: S-V1, vaeg: S-YV.1, type: V1, afstand: 1200, brystning: 850}
  - {id: S-V2, vaeg: S-YV.1, type: V1, afstand: 6900, brystning: 850}
  - {id: S-V3, vaeg: S-YV.3, type: V1, afstand: 2000, brystning: 850}
  - {id: S-V4, vaeg: S-YV.3, type: V1, afstand: 6500, brystning: 850}
  - {id: S-D1, vaeg: S-IV1, type: D1, afstand: 1500, slaar_mod: venstre}
  - {id: S-D2, vaeg: S-IV2, type: D1, afstand: 2000, slaar_mod: venstre, haengsel: slut}
  - {id: T-V1, vaeg: T-YV.4, type: V1, afstand: 3660, brystning: 900}

daek:
  - {id: K-GULV, etage: K, type: KG, omrids: {fra_vaegge: K-YV, kant: inderside}, art: bund}
  - {id: S-GULV, etage: S, type: BJL, omrids: {fra_vaegge: K-YV, kant: inderside}, huller: [[[5100, 5600], [6000, 5600], [6000, 8200], [5100, 8200]],
                  [[4300, 3400], [4800, 3400], [4800, 3900], [4300, 3900]]]}
  - {id: T-GULV, etage: "1", type: BJL, omrids: {fra_vaegge: S-YV, kant: inderside},
     huller: [[[4300, 3400], [4800, 3400], [4800, 3900], [4300, 3900]]]}

tage:
  - {id: TAG1, etage: "1", navn: Sadeltag, form: sadeltag, omrids: [0, 0, 10000, 8500], rygning: x, haeldning: 45,
     tagfod: 400, udhaeng: 400, udhaeng_gavl: 150, type: TAG,
     spaer: {afstand: 900, b: 50, hanebaand: 2300, vindbaand: {b: 100, t: 25}}}  # spær i typens spærlag, veksler om ovenlys og skorsten, vindbånd under spærene

ovenlys:  # punkt = vinduets midte i plan; bredde langs tagfoden, højde op ad tagfladen
  - {id: T-OV1, tag: TAG1, type: OV1, punkt: [2500, 2600]}
  - {id: T-OV2, tag: TAG1, type: OV1, punkt: [7500, 2600]}
  - {id: T-OV3, tag: TAG1, type: OV1, punkt: [2500, 5900]}
  - {id: T-OV4, tag: TAG1, type: OV1, punkt: [7500, 5900]}

trapper:
  - {id: TR-K, etage: K, start: [5550, 5300], retning: 90, bredde: 800, stigninger: 13, grund: 220}

soejler:
  - {id: K-S1, etage: K, punkt: [2500, 4250], profil: {form: rhs, b: 100, h: 60, t: 5}, materiale: stål, kilde: D,
     ref: "Statik 1977"}

bjaelker:
  - {id: K-B1, etage: K, fra: [300, 4250, 2150], til: [5000, 4250, 2150], profil: {form: i, h: 160, b: 74, tw: 6.3, tf: 9.5},
     materiale: stål, kilde: D}

rum:
  - {id: K.01, etage: K, navn: Fyrrum, punkt: [2500, 2000]}
  - {id: K.02, etage: K, navn: Grovkøkken, punkt: [7500, 2000]}
  - {id: S.01, etage: S, navn: Stue, punkt: [2500, 2000]}
  - {id: S.02, etage: S, navn: Køkken, punkt: [2500, 6000]}
  - {id: S.03, etage: S, navn: Spisestue, punkt: [7500, 4000]}
  - {id: T.01, etage: "1", navn: Værelse, punkt: [5000, 4250], til_tag: TAG1}

# VVS: pillefyr med 2-strenget centralvarme (ring langs kælderens ydervægge, stigstrenge op til radiatorerne under
# vinduerne), indirekte opvarmet varmtvandsbeholder, koldt og varmt brugsvand til køkken og grovkøkken samt
# spildevand under kældergulvet med fald mod brønd foran huset. Rør er etage K; z er målt fra kældergulvet
# (stueetagens gulv = 2400, tagetagens = 5300). Fremløb ligger i z 1850, retur i 1700, koldt vand 1450, varmt 1300.
systemer:
  - {id: CV-F, navn: Centralvarme fremløb, art: varme}
  - {id: CV-R, navn: Centralvarme retur, art: varme, farve: [130, 40, 160]}
  - {id: BV-K, navn: Brugsvand koldt, art: brugsvand_koldt}
  - {id: BV-V, navn: Brugsvand varmt, art: brugsvand_varmt}
  - {id: AF, navn: Spildevand, art: afloeb}

installationer:
  # varmecentral i fyrrummet
  - {id: KEDEL, etage: K, art: pillefyr, navn: Pillefyr 12 kW, punkt: [1500, 1200, 0], geometri: {kasse: [600, 700, 1300]},
     system: CV-F, producent: Eksempel, kilde: F}
  - {id: PUMPE, etage: K, art: pumpe, navn: Cirkulationspumpe, punkt: [1350, 800, 1775], rotation: 90,
     geometri: {kasse: [150, 150, 150]}, system: CV-F}
  - {id: EKSP, etage: K, art: ekspansionsbeholder, navn: Ekspansionsbeholder 18 l, punkt: [2300, 650, 1050],
     geometri: {cylinder: [300, 450]}, system: CV-R}
  - {id: VVB, etage: K, art: beholder, navn: Varmtvandsbeholder 100 l, punkt: [8500, 1000, 0], geometri: {cylinder: [520, 900]},
     system: BV-V}
  # radiatorer under vinduerne
  - {id: RAD1, etage: S, art: radiator, navn: Radiator stue, punkt: [1790, 380, 150], geometri: {kasse: [800, 100, 500]}, system: CV-F}
  - {id: RAD2, etage: S, art: radiator, navn: Radiator spisestue syd, punkt: [7490, 380, 150], geometri: {kasse: [800, 100, 500]},
     system: CV-F}
  - {id: RAD3, etage: S, art: radiator, navn: Radiator spisestue nord, punkt: [7410, 8120, 150], geometri: {kasse: [800, 100, 500]},
     system: CV-F}
  - {id: RAD4, etage: S, art: radiator, navn: Radiator køkken, punkt: [2910, 8120, 150], geometri: {kasse: [800, 100, 500]},
     system: CV-F}
  - {id: RAD5, etage: "1", art: radiator, navn: Radiator værelse, punkt: [380, 4250, 150], rotation: 90,
     geometri: {kasse: [800, 100, 500]}, system: CV-F}
  # vandindlæg ved østvæggen
  - {id: HV, etage: K, art: ventil, navn: Hovedhane, punkt: [9620, 2750, 1390], rotation: 90, geometri: {kasse: [100, 90, 120]},
     system: BV-K}
  - {id: VM, etage: K, art: vandmaaler, navn: Vandmåler, punkt: [9620, 2300, 1390], rotation: 90, geometri: {kasse: [220, 110, 120]},
     system: BV-K}
  # tapsteder og afløb
  - {id: KV, etage: S, art: koekkenvask, navn: Køkkenvask i underskab, punkt: [4630, 6500, 0], rotation: 90,
     geometri: {kasse: [800, 600, 900]}, system: AF}
  - {id: WC, etage: K, art: wc, navn: Toilet grovkøkken, punkt: [5390, 2400, 0], rotation: 90, geometri: {kasse: [400, 650, 400]},
     system: AF}
  - {id: HVASK, etage: K, art: haandvask, navn: Håndvask grovkøkken, punkt: [5300, 1600, 650], rotation: 90,
     geometri: {kasse: [500, 400, 200]}, system: AF}
  - {id: GA, etage: K, art: gulvafloeb, navn: Gulvafløb, punkt: [7000, 3000, 0], geometri: {cylinder: [200, 20]}, system: AF}
  - {id: BRØND, etage: K, art: broend, navn: Rensebrønd Ø425, punkt: [7000, -1500, -700], geometri: {cylinder: [425, 3100]},
     system: AF}

roer:
  # centralvarme: fremløb og retur som ring langs ydervæggene
  - {id: R-CV-F, etage: K, system: CV-F, diameter: 28, materiale: kobber,
     punkter: [[1350, 1200, 1300], [1350, 1200, 1850], [1350, 380, 1850], [9620, 380, 1850], [9620, 8120, 1850],
               [380, 8120, 1850], [380, 3900, 1850]]}
  - {id: R-CV-R, etage: K, system: CV-R, diameter: 28, materiale: kobber,
     punkter: [[520, 4600, 1700], [520, 7980, 1700], [9480, 7980, 1700], [9480, 520, 1700], [1650, 520, 1700],
               [1650, 1200, 1700], [1650, 1200, 1300]]}
  - {id: R-EKSP, etage: K, system: CV-R, diameter: 18, materiale: kobber, punkter: [[2300, 520, 1700], [2300, 650, 1700], [2300, 650, 1500]]}
  # stigstrenge til radiatorerne (fremløb i venstre ende, retur i højre)
  - {id: R-RAD1-F, etage: K, system: CV-F, diameter: 15, materiale: kobber, punkter: [[1440, 380, 1850], [1440, 380, 2550]]}
  - {id: R-RAD1-R, etage: K, system: CV-R, diameter: 15, materiale: kobber,
