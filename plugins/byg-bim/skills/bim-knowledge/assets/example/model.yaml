  - {id: R-AF-WC, etage: K, system: AF, diameter: 110, materiale: pvc, punkter: [[5390, 2400, 0], [5390, 2400, -200], [5390, 3000, -292]]}
  - {id: R-AF-HV, etage: K, system: AF, diameter: 50, materiale: pvc, punkter: [[5300, 1600, 650], [5300, 1600, -200], [5300, 3000, -291]]}
  - {id: R-AF-GA, etage: K, system: AF, diameter: 75, materiale: pvc, punkter: [[7000, 3000, 0], [7000, 3000, -310]]}
  - {id: R-KLOAK, etage: K, system: AF, diameter: 110, materiale: pvc, punkter: [[7000, -1710, -380], [7000, -5000, -450]]}

