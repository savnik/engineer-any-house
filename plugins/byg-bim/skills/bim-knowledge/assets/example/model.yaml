# Eksempelmodel (fiktiv): murermesterhus 1930'erne, kælder + stue + udnyttet tagetage under sadeltag.
# Bruges som skabelon og som test af værktøjet. Alle længder i mm. Lokale akser: x langs facaden mod vej.
model:
  navn: Eksempelhus
  schema: IFC4
  adresse: {vej: Eksempelvej 1, postnr: "9999", by: Eksempelby}
  bygning: {navn: Hus, opfoerelsesaar: 1937, anvendelse: Fritliggende enfamiliehus}
  geo: {oest: 720000.0, nord: 6180000.0, kote: 35.80, x_retning: 100}   # x peger mod ØSØ
  kontrol:
    areal: {K: 85.0, S: 85.0}        # BBR-arealer (brutto, m²) til sammenligning
    tolerance: 0.06

standard: {kilde: A, status: eksisterende}

typer:
  YV-beton:   {klasse: vaeg, navn: Kælderydervæg beton 300, lag: [[beton, 300]], ude: true, baerende: true}
  YV-hulmur:  {klasse: vaeg, navn: Ydervæg hulmur 300, lag: [[tegl, 108], [mineraluld, 84], [tegl, 108]],
               ude: true, baerende: true, u: 0.55}
  IV-mur:     {klasse: vaeg, navn: Indervæg ½-sten pudset, lag: [[puds, 10], [tegl, 108], [puds, 10]], baerende: true}
  IV-let:     {klasse: vaeg, navn: Let skillevæg, lag: [[gips, 13], [træ, 70], [gips, 13]]}
  GAVL:       {klasse: vaeg, navn: Gavl hulmur 300, lag: [[tegl, 108], [mineraluld, 84], [tegl, 108]], ude: true, baerende: true}
  KG:         {klasse: daek, navn: Kældergulv beton, lag: [[beton, 100], [grus, 150]]}
  BJL:        {klasse: daek, navn: Træbjælkelag, lag: [[træ gulv, 25], [træbjælker, 200], [puds på rør, 25]], baerende: true}
  TAG:        {klasse: tag, navn: Tegltag på lægter, lag: [[tagsten, 50], [lægter, 50], [spær, 150]]}
  V1:         {klasse: vindue, navn: Vindue 2-fag, bredde: 1180, hoejde: 1300, felter: 2}
  V2:         {klasse: vindue, navn: Kældervindue, bredde: 800, hoejde: 500}
  OV1:        {klasse: vindue, navn: Ovenlysvindue, bredde: 780, hoejde: 1180, ramme: 90}
  D1:         {klasse: doer, navn: Indvendig dør, bredde: 825, hoejde: 2040}
  D2:         {klasse: doer, navn: Hoveddør, bredde: 925, hoejde: 2100}

etager:
