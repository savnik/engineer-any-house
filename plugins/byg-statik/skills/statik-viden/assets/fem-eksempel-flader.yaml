# fem.yaml – eksempel med flader: hus med vægge og dæk som skalelementer og en stålbjælke over en ny åbning
# i den bærende midtervæg. Viser, hvor lasten samler sig (vægenderne ved bjælken, dækket over åbningen).
# Enheder: m, kN, kNm; tykkelser, profiler og tværsnit i mm. z er lodret op. Flader giver altid en 3D-model.
navn: hus-aabning-midtervaeg
beskrivelse: Parcelhus 10 × 8 m, gasbetonvægge og 180 mm betondæk. Midtervæggen får en 4,25 m åbning med HEB160.
mesh: 0.25                  # elementstørrelse i m (kan sættes pr. flade). Mindre = finere, men langsommere

knuder:                     # navn: [x, y, z]. Hjørner af flader, bjælkeender og linjer, der skal bruges
  A0: [0, 0, 0]
  B0: [10, 0, 0]
  C0: [10, 8, 0]
  D0: [0, 8, 0]
  A1: [0, 0, 2.5]
  B1: [10, 0, 2.5]
  C1: [10, 8, 2.5]
  D1: [0, 8, 2.5]
  M0: [5, 0, 0]
  M1: [5, 0, 2.5]
  N0: [5, 8, 0]
  N1: [5, 8, 2.5]
  J1: [5, 1.5, 2.5]         # bjælkeender: 250 mm vederlag på hver vægende
  J2: [5, 6.25, 2.5]

flader:
  # hjoerner: fire knuder [A, B, C, D] rundt om et rektangel. Lokale akser: u langs A→B, v langs A→D.
  # aabninger: x, y = hjørne (m fra A langs u og v), b × h = bredde × højde. Vægge: tegn A→B vandret, A→D op,
  # så er n_v den lodrette membrankraft (tryk < 0).
  Syd:  {hjoerner: [A0, B0, B1, A1], tykkelse: 300, materiale: gasbeton,
         aabninger: [{x: 1.0, y: 0.75, b: 1.5, h: 1.25}, {x: 4.0, y: 0, b: 1.0, h: 2.0}, {x: 6.5, y: 0.75, b: 2.5, h: 1.25}]}
  Nord: {hjoerner: [D0, C0, C1, D1], tykkelse: 300, materiale: gasbeton,
         aabninger: [{x: 1.5, y: 0.75, b: 1.0, h: 1.25}, {x: 5.0, y: 0.75, b: 3.0, h: 1.25}]}
  Vest: {hjoerner: [A0, D0, D1, A1], tykkelse: 300, materiale: gasbeton, aabninger: [{x: 3.0, y: 0.75, b: 2.0, h: 1.25}]}
  Oest: {hjoerner: [B0, C0, C1, B1], tykkelse: 300, materiale: gasbeton}
  Midt: {hjoerner: [M0, N0, N1, M1], tykkelse: 100, materiale: gasbeton,
         aabninger: [{x: 1.75, y: 0, b: 4.25, h: 2.5}]}      # åbning i fuld højde – bjælken bærer dækket
  Daek: {hjoerner: [A1, B1, C1, D1], tykkelse: 180, materiale: C25/30}
  # materialer til flader skal være isotrope: C20/25 … C30/37, S235, S355, gasbeton, tegl eller eget med E, nu, rho.
  # Træ (bjælkelag, spær) modelleres som elementer, ikke flader.

elementer:
  J:  {fra: J1, til: J2, profil: HEB160, materiale: S235}   # forbindes med dæk og vægender i alle knuder på linjen

understoetninger_linje:     # understøtning langs en linje (alle knuder på linjen), type som for knuder
  - {fra: A0, til: B0}
  - {fra: B0, til: C0}
  - {fra: C0, til: D0}
  - {fra: D0, til: A0}
  - {fra: M0, til: N0}

udtraek:                    # resultater for et område af en flade (x, y i fladens lokale akser, m fra hjørne A)
  vaegende-syd: {flade: Midt, x: [0, 1.75], y: [0, 2.5]}
  vaegende-nord: {flade: Midt, x: [6.0, 8.0], y: [0, 2.5]}

lasttilfaelde:
  G: {egenvaegt: true}      # elementer og flader (A·ρ og t·ρ)
  Q:
    laster:
      - {flade: Daek, tryk: 1.5}                 # kN/m² på fladen, retning ned (standard), x, y, z eller normal
  W:
    laster:
      - {flade: Syd, tryk: 0.8, retning: y}      # vind mod sydfacaden
  # linjelast langs en linje (fx tag på murkrone): {linje: [A1, B1], linjelast: 3.0}

kombinationer:
  STR-6.10b: {type: brud, faktorer: {G: 1.0, Q: 1.5, W: 0.45}}
  SLS: {type: anvendelse, faktorer: {G: 1.0, Q: 1.0}, graense: 400}
